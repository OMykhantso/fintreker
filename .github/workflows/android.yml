name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (JUnit4 + MockK)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Unit test summary
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET

          tests = failures = errors = skipped = 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(path).getroot()
              tests += int(root.get("tests"))
              failures += int(root.get("failures"))
              errors += int(root.get("errors"))
              skipped += int(root.get("skipped"))
          print(f"Unit tests: total={tests} failures={failures} errors={errors} skipped={skipped}")
          PY

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # Знімки проєкту після Лаб 1–5 (labs/labN) — кожен збирається самостійно.
  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lab: [lab1, lab2, lab3, lab4, lab5]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: labs/${{ matrix.lab }}

      - name: Build debug APK (${{ matrix.lab }})
        working-directory: labs/${{ matrix.lab }}
        run: ./gradlew assembleDebug --stacktrace
